[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaptrace"
version = "0.1.0"
description = "A research-gap finder that runs on a small local model"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "networkx", "rank-bm25", "numpy", "typer", "rich>=13", "tokenizers>=0.23.3"]

[project.optional-dependencies]
models = ["litellm"]
sentence-embeddings = ["sentence-transformers"]
serve = ["mcp>=2", "fastapi", "uvicorn"]
collect = ["arxiv", "pyalex", "semanticscholar", "docling"]
dev = ["pytest", "httpx"]

[project.scripts]
gaptrace = "gaptrace.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaptrace = ["assets/*.json", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
pythonpath = ["src"]
